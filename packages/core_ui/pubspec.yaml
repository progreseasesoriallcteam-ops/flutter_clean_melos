name: core_ui
description: "Shared UI components, theme, and design system for Progrese."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  core:
    path: ../core
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  google_fonts: ^6.2.1
  riverpod_annotation: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
